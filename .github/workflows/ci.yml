name: toolkit-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile toolkit/scripts/ai_toolkit.py toolkit/evals/run_evals.py
      - run: python -m unittest discover -s toolkit/tests -v
      - run: python toolkit/evals/run_evals.py
      - run: python toolkit/scripts/ai_toolkit.py inspect . --json
      - run: python toolkit/scripts/ai_toolkit.py validate-spec toolkit/evals/fixtures/valid-feature-spec.md --json

  mcp-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r toolkit/requirements-mcp.txt
      - run: python -m unittest toolkit.tests.test_mcp -v
